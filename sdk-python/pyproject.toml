[project]
name = "flowbench"
version = "0.1.0"
description = "Python authoring surface that compiles declarative flows to the flowbench canonical IR"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
