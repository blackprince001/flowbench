name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: sdk-python/uv.lock

      - name: install python toolchain
        run: uv sync --locked --project sdk-python

      # tests/flows holds the Python conformance fixture, outside the SDK tree.
      - name: ruff check
        run: uv run --frozen --project sdk-python ruff check --config sdk-python/ruff.toml sdk-python tests/flows

      - name: ruff format
        run: uv run --frozen --project sdk-python ruff format --check --config sdk-python/ruff.toml sdk-python tests/flows

  python-test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: sdk-python/uv.lock

      - name: pytest
        run: uv run --locked --directory sdk-python --python ${{ matrix.python-version }} pytest

  build-test:
    # Name is load-bearing: main's ruleset requires a check called
    # "build & test", so renaming this job blocks every merge.
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: sdk-python/uv.lock

      # internal/conformance compiles a Python flow and diffs its IR against
      # the YAML parser's, so the Go suite needs the SDK environment too.
      - name: install python toolchain
        run: uv sync --locked --project sdk-python

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        env:
          FLOWBENCH_PYTHON: ${{ github.workspace }}/sdk-python/.venv/bin/python
          # Turn the conformance suite's "no usable interpreter" skip into a
          # failure: CI provisions one, so a skip here means CI is broken.
          FLOWBENCH_REQUIRE_PYTHON: "1"
        run: go test -race ./...
