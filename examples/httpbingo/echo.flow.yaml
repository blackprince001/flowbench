# Chaining without a login: take a value the service generated, send it back,
# and prove it round-tripped. /anything echoes the whole request, so the last
# step can assert on what the flow itself sent — including the header carrying
# the value extracted two steps earlier.
#
# The credential comes from the environment, never the file (ADR 0005). Any
# value resolved through {{ env.* }} is registered as a secret and scrubbed from
# stored artifacts — so this flow deliberately sends a real one to an endpoint
# that hands it straight back, and it still reaches nothing on disk:
#
#   DEMO_TOKEN=hunter2-do-not-leak flowbench run examples/httpbingo/echo.flow.yaml \
#     --target examples/httpbingo/target.yaml
#   grep -rc hunter2-do-not-leak runs/   # 0 — kept traces hold the echo, redacted
#   grep -rl '\[redacted\]' runs/        # and say where it was
#
# It runs a small load profile rather than a single iteration precisely so there
# are stored traces to grep: integration mode prints and exits without writing a
# run at all.
flow: echo_round_trip
steps:
  - id: mint_id
    call: GET /uuid
    extract:
      request_id: $.uuid
    assert:
      - status == 200
      - header.Content-Type contains "application/json"
      - $.uuid matches "^[0-9a-f-]{36}$"
      - latency < 5000ms

  # Send the minted id back in both a header and a JSON body, with the
  # environment-sourced credential alongside it.
  - id: echo_back
    call: POST /anything
    headers:
      X-Request-Id: "{{ request_id }}"
      Authorization: "Bearer {{ env.DEMO_TOKEN }}"
      Content-Type: application/json
    body:
      { "request_id": "{{ request_id }}", "step": "echo_back" }
    extract:
      echoed: $.json.request_id
    assert:
      - status == 200
      - $.method == "POST"
      - $.json.step == "echo_back"
      # The header arrived as sent. httpbingo returns headers as arrays.
      - $.headers.X-Request-Id[0] != null
      - echoed != null

  - id: settle
    wait: 200ms

  # A last look at the same value, now as a query parameter, closing the loop.
  - id: confirm
    call: GET /response-headers
    query:
      X-Confirmed: "{{ echoed }}"
    assert:
      - status == 200
      - header.X-Confirmed != null

profile:
  mode: load
  vus: 2
  arrival_cap: 3/s
  hold: 6s
  thresholds:
    - error_rate < 5%
