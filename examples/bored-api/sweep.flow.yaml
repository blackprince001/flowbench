# Bored API — a data-driven sweep. The runner runs the flow once per row in
# the bound data pool, so a 1000-row file == 1000 iterations. Each row supplies
# a `type`/`participants` pair, injected into the /filter query as {{ user.* }}.
#
# NOTE: the public API is rate-limited to 100 requests / 15 min. Pointed at
# https://bored-api.appbrewery.com this will pass ~100 iterations, then get
# 429-throttled and fail the rest. Run the full 1000 against a local or
# unrated target instead:  flowbench run examples/bored-api/sweep.flow.yaml --target local
flow: bored_filter_sweep
data: filters.csv
steps:
  - id: filter
    call: GET /filter
    query:
      type: "{{ user.type }}"
      participants: "{{ user.participants }}"
    assert:
      - status == 200
      - header.Content-Type contains "application/json"
